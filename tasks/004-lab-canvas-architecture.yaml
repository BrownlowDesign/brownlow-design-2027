id: "004"
title: Lab — persistent canvas, scene registry, shader pipeline
type: lab
status: ready
depends_on: ["002", "003"]
goal: >
  Turn the minimal CanvasRoot into the real architecture: scene registry, drei View tracking DOM elements,
  scenes that span route transitions, shader loading with #include and generated token constants, and
  poster generation for the static tier. Output ADR-0004 and one reference scene that new scenes copy.

read_first:
  - docs/WEBGL.md
  - docs/decisions/0002-scroll-engine.md
  - docs/decisions/0003-page-transitions.md

scope:
  allow:
    - "src/gl/**"
    - "src/motion/**"
    - "src/app/lab/canvas/**"
    - "next.config.*"
    - "tests/**"
    - "docs/decisions/0004-*.md"
    - "docs/WEBGL.md"
    - "package.json"
    - "pnpm-lock.yaml"
    - "plans/**"
  deny:
    - "scripts/**"
    - "tests/visual/__screenshots__/**"

constraints:
  - "Exactly one <Canvas>. Two scenes visible at once on /lab/canvas, each tracking a different DOM element via View."
  - "Shader import with #include resolved at build time (webpack/turbopack loader or a glsl plugin). The same include syntax must work in pnpm shaders."
  - "Reference scene uses tokens.glsl colors and uniforms uTime, uProgress (from a scroll scene), uTransition (from 003), uResolution."
  - "Scene that persists across a route transition: an element on page A morphs into a different composition on page B (uTransition-driven)."
  - "Static tier: each scene has poster.png generated by a script using snap; DOM shows the poster in place of the View."

deliverables:
  - "src/gl/registry.ts, src/gl/scenes/_reference/ (Scene.tsx, uniforms.ts, *.vert, *.frag, poster.png, README.md)"
  - "/lab/canvas route + /lab/canvas/next to test cross-route persistence"
  - "Updated docs/WEBGL.md if anything changed"
  - "docs/decisions/0004-canvas-architecture.md (proposed)"
  - "skill update proposal: if .claude/skills/add-shader-scene/SKILL.md needs changes, write the proposed diff in the plan (skills are out of scope; Ryan applies)"

done_when:
  - check: "pnpm shaders compiles all shaders including includes; a deliberately broken shader reports file + line (then reverted)"
    evidence: "shaders output in plan"
  - check: "Two Views render deterministically at progress 0, .5, 1"
    evidence: "snap hashes"
  - check: "Cross-route scene snaps at tp 0, .5, 1"
    evidence: snap paths
  - check: "Memory budget holds across 20 navigations"
    evidence: "artifacts/perf/*.json"
  - check: "pnpm perf /lab/canvas within budgets (desktop + mobile emulation)"
    evidence: "artifacts/perf/*.json"
  - check: "ADR-0004 accepted by Ryan"
    by: ryan
  - check: "pnpm verify --full --task=004 passes"
    evidence: artifacts/verify.json

escalate_when:
  - drei View can't stay aligned with DOM during the chosen scroll engine's smoothing
  - The bundler can't resolve #include in shaders without a dependency Ryan hasn't approved

budget:
  max_retries_per_check: 3
