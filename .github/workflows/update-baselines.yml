name: update-baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble  # must match @playwright/test version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate baselines
        run: pnpm exec playwright test --update-snapshots
        env:
          NEXT_PUBLIC_LAB: '1'
          HOME: /root
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "baseline-bot"
          git config user.email "baseline-bot@users.noreply.github.com"
          git add tests/visual/__screenshots__/
          git diff --cached --quiet || git commit -m "Update visual baselines (Linux, via CI)"
          git push