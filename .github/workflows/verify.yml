name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify (standard)
        run: node scripts/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify
          path: artifacts/verify.json

  visual:
    runs-on: ubuntu-latest
    needs: checks
    # Same image as `pnpm visual:docker` so baselines match. Keep tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Visual checkpoints
        run: pnpm exec playwright test --pass-with-no-tests
        env:
          NEXT_PUBLIC_LAB: '1'
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
